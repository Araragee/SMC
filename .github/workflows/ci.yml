name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations apply on fresh DB
        env:
          SECRET_KEY: ci-not-a-real-secret-do-not-use
        run: |
          rm -f sql_app.db
          cd .. && alembic -c backend/alembic.ini upgrade head
      - name: Pytest
        env:
          SECRET_KEY: ci-not-a-real-secret-do-not-use
        run: pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # eslint exits non-zero only on errors; warnings still exit 0. The
      # `|| echo` that used to be here swallowed the errors too, so the step
      # could not fail — including on the missing `v-for` key and the no-op
      # try/catch wrappers that were sitting in the tree.
      - name: Lint
        run: npx eslint src/
      # vue-tsc, not tsc: plain tsc does not look inside .vue single-file
      # components, which is most of this codebase. The type check that the
      # frontend actually relies on was not being run in CI at all.
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python deps
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/requirements.txt --strict || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm deps
        working-directory: frontend
        run: npm audit --audit-level=high || true
