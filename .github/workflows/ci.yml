name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations apply on fresh DB
        env:
          SECRET_KEY: ci-not-a-real-secret-do-not-use
        run: |
          rm -f sql_app.db
          cd .. && alembic -c backend/alembic.ini upgrade head
      - name: Pytest
        env:
          SECRET_KEY: ci-not-a-real-secret-do-not-use
        run: pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npx eslint src/ || echo "::warning::eslint warnings present"
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python deps
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/requirements.txt --strict || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm deps
        working-directory: frontend
        run: npm audit --audit-level=high || true
